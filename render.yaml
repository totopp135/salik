# One-click deploy on Render: the Salik web service.
# The database lives on Neon (free, never expires): paste its connection string as DATABASE_URL.
services:
  - type: web
    name: salik
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
